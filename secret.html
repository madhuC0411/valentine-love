<!DOCTYPE html>
<html>
<head>
<title>Scan My Love ❤️</title>

<style>
body {
  background: #ffe4ec;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  font-family: Arial;
  text-align: center;
  overflow: hidden;
}

.container {
  background: white;
  padding: 20px;
  border-radius: 15px;
  position: relative;
  z-index: 2;
}

img {
  width: 250px;
  margin: 10px;
  border-radius: 10px;
}

/* floating hearts */
.heart {
  position: absolute;
  color: red;
  font-size: 24px;
  animation: floatUp 4s linear forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(0);
    opacity: 1;
  }
  to {
    transform: translateY(-800px);
    opacity: 0;
  }
}

</style>

</head>
<body>

<div class="container">

<img src="dudu-bubu.gif">

<br>

<h2>Scan this to see my surprise ❤️</h2>

<br>

<img src="qr.png" width="200">

</div>

<script>

function createHeart() {

  let heart = document.createElement("div");

  heart.innerHTML = "❤️";
  heart.className = "heart";

  heart.style.left = Math.random() * window.innerWidth + "px";
  heart.style.top = window.innerHeight + "px";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 4000);
}

// hearts continuously appear
setInterval(createHeart, 300);

</script>

</body>
</html>
